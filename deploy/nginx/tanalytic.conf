# Пример. Не развёрнуто, применять при >50-100 пользователях. Подставьте домен и пути сертификатов.
proxy_cache_path /var/cache/nginx/tanalytic levels=1:2 keys_zone=snap_cache:10m max_size=256m inactive=10m use_temp_path=off;

upstream tanalytic_data {
    server 127.0.0.1:8780;
    keepalive 16;
}

server {
    listen 80;
    server_name data.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name data.example.org;

    ssl_certificate     /etc/letsencrypt/live/data.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1400;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-Key $http_x_client_key;

    # Снэпшот рынка: общий для всех, кэш на 60 с (см. замечание в README про авторизацию).
    location /v1/market/snapshot {
        proxy_pass http://tanalytic_data;
        proxy_cache snap_cache;
        proxy_cache_key $scheme$request_uri;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
    }

    location /v1/ {
        proxy_pass http://tanalytic_data;
        proxy_read_timeout 60s;
    }
}
