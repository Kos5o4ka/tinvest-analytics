name: build-tauri

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Версия / тег сборки (например v0.31.0)"
        required: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Сборка tinvest_analytics.py из src/
        run: python3 build.py

      - name: Зависимости и скрытые импорты для sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.3 certifi pillow
          python packaging/vendor_lock.py --download vendor_wheels
          python packaging/gen_hidden_imports.py tinvest_analytics.py --wheels vendor_wheels -o packaging/hidden_imports.txt

      - name: Сборка Python sidecar (TAnalytic-backend)
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          ARGS=(
            --onefile
            --noconsole
            --noconfirm
            --name TAnalytic-backend
            --collect-data certifi
            --collect-submodules encodings
            --distpath build_tauri_sidecar/dist
            --workpath build_tauri_sidecar/work
          )
          while IFS= read -r mod; do
            mod="${mod%%#*}"
            mod="${mod//[$'\r\n ']}"
            if [ -n "$mod" ]; then
              ARGS+=(--hidden-import "$mod")
            fi
          done < packaging/hidden_imports.txt
          pyinstaller "${ARGS[@]}" tinvest_analytics.py
          EXT=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; fi
          cp "build_tauri_sidecar/dist/TAnalytic-backend${EXT}" "src-tauri/binaries/TAnalytic-backend-${{ matrix.target }}${EXT}"

      - name: Генерация иконок Tauri
        run: |
          python - << 'PY'
          import os, sys
          sys.path.insert(0, "packaging")
          import make_icon
          out = "src-tauri/icons"
          os.makedirs(out, exist_ok=True)
          make_icon.draw(32).save(os.path.join(out, "32x32.png"))
          make_icon.draw(128).save(os.path.join(out, "128x128.png"))
          make_icon.draw(256).save(os.path.join(out, "128x128@2x.png"))
          big = make_icon.draw(1024)
          big.save(os.path.join(out, "icon.png"))
          sizes = (16, 24, 32, 48, 64, 128, 256)
          frames = [make_icon.draw(s) for s in sizes]
          frames[-1].save(os.path.join(out, "icon.ico"), format="ICO", sizes=[(s, s) for s in sizes], append_images=frames[:-1])
          big.save(os.path.join(out, "icon.icns"))
          PY

      - name: Сборка приложения Tauri v2
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }} --config '{"bundle":{"externalBin":["binaries/TAnalytic-backend"]}}'
          uploadPlainBinary: false

      - name: Загрузка артефактов Tauri
        uses: actions/upload-artifact@v4
        with:
          name: tanalytic-tauri-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
