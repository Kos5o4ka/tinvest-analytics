name: release-binaries
# Собирает нативные приложения (лаунчер в PyInstaller) и добавляет их к релизу.
# Ассет tinvest_analytics.py и его строку в SHA256SUMS не трогает: на них опирается лаунчер.
# Windows: onedir-сборка PyInstaller упаковывается установщиком Inno Setup (packaging/TAnalytic.iss) — TAnalytic-Setup-win.exe.
# Этот же файл программа скачивает сама при обновлении оболочки и сверяет с SHA256SUMS (tinvest.py, prepare_installer).
# Прежний одиночный TAnalytic-win.exe больше не публикуется: на него не ссылается ни одна версия лаунчера.
#
# Подпись и репутация (настраиваются вне этого файла, здесь только заметка):
#  * SignPath Foundation (бесплатно для открытого кода): после заявки подписывать TAnalytic-Setup-win.exe и TAnalytic.exe
#    отдельным шагом (signpath/github-action-submit-signing-request) между «Сборка установщика» и загрузкой артефакта;
#  * сразу после релиза отправлять установщик в Microsoft Security Intelligence (Submit a file for malware analysis,
#    «Software developer») — снимает ложные срабатывания Defender и копит репутацию SHA-256 для SmartScreen.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому добавить сборки (например v0.16)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: "1"              # русский вывод скриптов на Windows (иначе cp1252)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (arm64)
            asset: TAnalytic-mac-arm64.zip
          - os: macos-15-intel      # Intel; метка раннера может измениться — при необходимости обновите
            asset: TAnalytic-mac-x64.zip
          - os: windows-latest
            asset: TAnalytic-Setup-win.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # скрипты сборки — из ветки запуска (при релизе это тег, при ручном запуске — main); программа — из ассета релиза
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости сборки (только для сборки, в программе их нет)
        run: |
          # Загрузчик PyInstaller собираем из исходников (MSVC / clang на раннере): готовый загрузчик из колеса
          # одинаков у тысяч программ, и эвристики антивирусов помечают любую сборку с ним как подозрительную.
          PYINSTALLER_COMPILE_BOOTLOADER=1 pip install --no-binary pyinstaller pyinstaller==6.22.3
          pip install certifi pillow pywebview==6.2.1
          # Windows: pywebview берёт Edge WebView2 через pythonnet (ставится как зависимость; явно — на случай смены метаданных)
          if [ "$RUNNER_OS" = "Windows" ]; then pip install pythonnet clr_loader; fi
      - name: Программа из релиза (чтобы собрать список её импортов)
        run: gh release download "$TAG" -p tinvest_analytics.py -D release_app --clobber
      - name: Колёса дополнительных библиотек (скачиваются по SHA256 из замка, код не запускается)
        run: python packaging/vendor_lock.py --download vendor_wheels
      - name: Список импортов программы и её дополнительных библиотек
        run: python packaging/gen_hidden_imports.py release_app/tinvest_analytics.py --wheels vendor_wheels -o packaging/hidden_imports.txt
      - name: Иконки
        run: python packaging/make_icon.py build_icons
      - name: Сборка
        env:
          TINVEST_APP_SRC: release_app/tinvest_analytics.py
          TINVEST_ICON_DIR: build_icons
        run: pyinstaller --noconfirm --distpath build_out/dist --workpath build_out/work packaging/tinvest.spec
      - name: Проверка архитектуры и подпись (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="build_out/dist/TAnalytic.app"
          want="${{ contains(matrix.asset, 'arm64') && 'arm64' || 'x86_64' }}"
          info="$(file "$APP/Contents/MacOS/TAnalytic")"
          echo "$info"
          echo "$info" | grep -q "$want" || { echo "::error::ожидалась архитектура $want"; exit 1; }
          # arm64-бинарники без подписи macOS не запускает («повреждён»): подписываем ad-hoc явно
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | head -5
      - name: Упаковка (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "build_out/dist/TAnalytic.app" "${{ matrix.asset }}"
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          # Inno Setup на раннере может отсутствовать или быть старым (нужен 6.3+ для x64compatible) — upgrade ставит и в том, и в другом случае
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          choco upgrade innosetup -y --no-progress
          test -f "$ISCC" || { echo "::error::не найден ISCC.exe"; exit 1; }
      - name: Сборка установщика (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          test -f build_out/dist/TAnalytic/TAnalytic.exe || { echo "::error::нет onedir-сборки build_out/dist/TAnalytic"; exit 1; }
          export APP_VER="${TAG#v}"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/TAnalytic.iss
          cp build_out/TAnalytic-Setup-win.exe "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src_checkout
      - name: Колёса дополнительных библиотек — запасной источник для программы (основной — PyPI)
        run: python3 src_checkout/packaging/vendor_lock.py --download bin
      - name: Контрольные суммы и загрузка в релиз
        run: |
          set -euo pipefail
          mkdir sums && cd sums
          gh release download "$TAG" -p SHA256SUMS -R "$GITHUB_REPOSITORY" || touch SHA256SUMS
          cd ../bin
          ls -l
          # строки для наших бинарников заменяем, остальные (в том числе tinvest_analytics.py) не трогаем
          for f in *; do
            awk -v n="$f" '{ if ($2 != n && $2 != "*" n) print }' ../sums/SHA256SUMS > ../sums/tmp
            mv ../sums/tmp ../sums/SHA256SUMS
          done
          sha256sum * >> ../sums/SHA256SUMS
          cat ../sums/SHA256SUMS
          gh release upload "$TAG" * ../sums/SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
