name: release-binaries
# Собирает приложение на Tauri v2 (Rust-оболочка + Python-сервер TAnalytic-backend, PyInstaller --onedir в ресурсах бандла) и добавляет сборки к релизу.
# Публикуются под стабильными именами (их ждут баннер обновления, README и самообновление старых оболочек pywebview):
#   TAnalytic-Setup-win.exe (NSIS, x64), TAnalytic-mac-arm64.dmg (Apple Silicon; Mac на Intel не собираем с v0.31),
#   а для автообновления — подписи (*.sig), архивы *.app.tar.gz и latest.json.
# Ассет tinvest_analytics.py релиза не трогаем; в SHA256SUMS заменяются только строки наших файлов.
#
# Секреты (все необязательны, без них сборка не падает):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD — подпись обновлений (без ключа latest.json не создаётся);
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID — подпись и нотаризация macOS.
# Описание — в packaging/tauri/README.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому добавить сборки (например v0.31)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (arm64)
            target: aarch64-apple-darwin
            asset: TAnalytic-mac-arm64.dmg
            platform: darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: TAnalytic-Setup-win.exe
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Версия из тега в конфигурации Tauri
        run: |
          python - << 'PY'
          import json, os, re
          nums = (re.findall(r"\d+", os.environ["TAG"]) + ["0", "0", "0"])[:3]
          ver = ".".join(nums)
          p = "src-tauri/tauri.conf.json"
          d = json.load(open(p, encoding="utf-8"))
          d["version"] = ver
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("версия Tauri:", ver)
          PY

      - name: Сборка tinvest_analytics.py из src/
        run: python build.py

      - name: Зависимости и скрытые импорты для sidecar
        run: |
          # Загрузчик PyInstaller собираем из исходников: готовый загрузчик из колеса помечается антивирусами
          PYINSTALLER_COMPILE_BOOTLOADER=1 pip install --no-binary pyinstaller pyinstaller==6.22.3
          pip install --upgrade pip certifi pillow
          python packaging/vendor_lock.py --download vendor_wheels
          python packaging/gen_hidden_imports.py tinvest_analytics.py --wheels vendor_wheels -o packaging/hidden_imports.txt

      - name: Сборка Python-сервера (PyInstaller --onedir, кладётся в ресурсы бандла)
        run: |
          set -euo pipefail
          ARGS=(
            --onedir
            --noconfirm
            --name TAnalytic-backend
            --collect-data certifi
            --collect-submodules encodings
            --distpath build_tauri_sidecar/dist
            --workpath build_tauri_sidecar/work
          )
          if [ "$RUNNER_OS" = "Windows" ]; then ARGS+=(--noconsole); fi
          while IFS= read -r mod; do
            mod="${mod%%#*}"
            mod="${mod//[$'\r\n ']}"
            if [ -n "$mod" ]; then
              ARGS+=(--hidden-import "$mod")
            fi
          done < packaging/hidden_imports.txt
          pyinstaller "${ARGS[@]}" tinvest_analytics.py
          mkdir -p src-tauri/resources/backend
          cp -R build_tauri_sidecar/dist/TAnalytic-backend/. src-tauri/resources/backend/
          ls src-tauri/resources/backend | head

      - name: Подпись Python-сервера внутри бандла (macOS; Developer ID, если задан сертификат, иначе ad-hoc)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Tauri подписывает само приложение, но не Mach-O внутри ресурсов: подписываем их до упаковки
          # (hardened runtime и права из packaging/entitlements.plist); без сертификата — ad-hoc, иначе arm64 не запустит
          packaging/mac_codesign.sh setup
          packaging/mac_codesign.sh dir src-tauri/resources/backend

      - name: Иконки Tauri
        run: |
          python - << 'PY'
          import os, sys
          sys.path.insert(0, "packaging")
          import make_icon
          out = "src-tauri/icons"
          os.makedirs(out, exist_ok=True)
          make_icon.draw(32).save(os.path.join(out, "32x32.png"))
          make_icon.draw(128).save(os.path.join(out, "128x128.png"))
          make_icon.draw(256).save(os.path.join(out, "128x128@2x.png"))
          big = make_icon.draw(1024)
          big.save(os.path.join(out, "icon.png"))
          sizes = (16, 24, 32, 48, 64, 128, 256)
          frames = [make_icon.draw(s) for s in sizes]
          frames[-1].save(os.path.join(out, "icon.ico"), format="ICO", sizes=[(s, s) for s in sizes], append_images=frames[:-1])
          big.save(os.path.join(out, "icon.icns"))
          PY

      - name: Подпись обновлений (без секрета артефакты обновления отключаются)
        env:
          UPD_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPD_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.noupdater.conf.json
            echo "TAURI_EXTRA=--config tauri.noupdater.conf.json" >> "$GITHUB_ENV"
            echo "::warning::секрет TAURI_SIGNING_PRIVATE_KEY не задан: автообновление в этой сборке отключено"
          else
            echo "TAURI_EXTRA=" >> "$GITHUB_ENV"
          fi

      - name: Сборка приложения Tauri v2
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # В CI (CI=true) бандлер DMG добавляет --skip-jenkins и пропускает AppleScript Finder: тогда нет фона, позиций значков
          # и скрытия расширения («TAnalytic.app» вместо «TAnalytic»). Раннер macOS имеет сеанс Finder, скрипт отрабатывает.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }} ${{ env.TAURI_EXTRA }}

      - name: Убрать временную связку ключей (macOS)
        if: always() && runner.os == 'macOS'
        run: packaging/mac_codesign.sh cleanup

      - name: Файлы под стабильными именами
        run: |
          set -euo pipefail
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$B"/nsis/*-setup.exe "out/${{ matrix.asset }}"
            if ls "$B"/nsis/*-setup.exe.sig >/dev/null 2>&1; then cp "$B"/nsis/*-setup.exe.sig "out/${{ matrix.asset }}.sig"; fi
          else
            cp "$B"/dmg/*.dmg "out/${{ matrix.asset }}"
            TARNAME="${{ matrix.asset }}"; TARNAME="${TARNAME%.dmg}.app.tar.gz"
            if ls "$B"/macos/*.app.tar.gz >/dev/null 2>&1; then cp "$B"/macos/*.app.tar.gz "out/$TARNAME"; fi
            if ls "$B"/macos/*.app.tar.gz.sig >/dev/null 2>&1; then cp "$B"/macos/*.app.tar.gz.sig "out/$TARNAME.sig"; fi
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src_checkout
      - name: Колёса дополнительных библиотек — запасной источник для программы (основной — PyPI)
        run: python3 src_checkout/packaging/vendor_lock.py --download bin
      - name: latest.json для автообновления (только если сборки подписаны)
        run: |
          python3 - << 'PY'
          import datetime, json, os, re
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          nums = (re.findall(r"\d+", tag) + ["0", "0", "0"])[:3]
          base = "https://github.com/%s/releases/download/%s/" % (repo, tag)
          items = {
              "windows-x86_64": "TAnalytic-Setup-win.exe",
              "darwin-aarch64": "TAnalytic-mac-arm64.app.tar.gz",
          }
          plats = {}
          for plat, name in items.items():
              sig = os.path.join("bin", name + ".sig")
              if os.path.isfile(sig):
                  plats[plat] = {"signature": open(sig, encoding="utf-8").read().strip(), "url": base + name}
          if plats:
              doc = {"version": ".".join(nums), "notes": "", "platforms": plats,
                     "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}
              json.dump(doc, open("bin/latest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              print("latest.json:", sorted(plats))
          else:
              print("подписей нет — latest.json не создаётся")
          PY
      - name: Контрольные суммы и загрузка в релиз
        run: |
          set -euo pipefail
          mkdir sums && cd sums
          gh release download "$TAG" -p SHA256SUMS -R "$GITHUB_REPOSITORY" || touch SHA256SUMS
          cd ../bin
          ls -l
          # строки для наших файлов заменяем, остальные (в том числе tinvest_analytics.py) не трогаем
          for f in *; do
            awk -v n="$f" '{ if ($2 != n && $2 != "*" n) print }' ../sums/SHA256SUMS > ../sums/tmp
            mv ../sums/tmp ../sums/SHA256SUMS
          done
          sha256sum * >> ../sums/SHA256SUMS
          cat ../sums/SHA256SUMS
          gh release upload "$TAG" * ../sums/SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
